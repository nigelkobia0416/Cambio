 <div className="gr">${p.cards.map((c,j)=>c?h`<${Card} key=${j} k=${i+':'+j} c=${c} lb=${lbl(j)} up=${g.st==='over'||(g.st==='peek'?(i===me&&lv.includes(j)):(g.cur===me&&g.view.some(v=>v.p===i&&v.i===j)))} cls=${(g.sel.some(v=>v.p===i&&v.i===j)?'sel':'')+(g.hl.includes(i+':'+j)?' hl':'')} on=${()=>tap(i,j)}/>`:h`<div key=${j} data-k=${i+':'+j} className="e"/>`)}</div></div>`};
const reset=(s,n)=>{const h2=s.host;for(const k in s)delete s[k];Object.assign(s,n,{host:h2})};
function App(){
 const[room,setRoom]=useState(null),ref=useRef(null),sf=useRef(null);
 const[cid]=useState(()=>{try{let c=localStorage.getItem('cambio-id');if(!c){c=Math.random().toString(36).slice(2,10);localStorage.setItem('cambio-id',c)}return c}catch(e){return Math.random().toString(36).slice(2,10)}});
 const[name,setName]=useState(()=>{try{return localStorage.getItem('cambio-name')||''}catch(e){return ''}});
 const[code,setCode]=useState((location.hash||'').replace('#','').toUpperCase().slice(0,4));
 const[err,setErr]=useState(''),[lv,setLv]=useState([]),[sn,setSn]=useState([]),[sp,setSp]=useState(1);SP=sp;
 const g=room?room.state:{st:'home',fx:[],hl:[]};
 const mi=g.P?g.P.findIndex(p=>p.id===cid):-1;ME=mi;
 const apply=r=>{if(!r||(ref.current&&ref.current.version>=r.version))return;ref.current=r;setRoom(r)};
 const act=async f=>{if(!ref.current)return;
  for(let t=0;t<4;t++){const r=ref.current,n=structuredClone(r.state);n.fx=[];n.hl=[];f(n);
   if(n.fx.length)n.fxn=Math.random();
   if(JSON.stringify(n)===JSON.stringify(r.state))return;
   const{data}=await sb.from(T).update({state:n,version:r.version+1}).eq('code',r.code).eq('version',r.version).select();
   if(data&&data.length){apply(data[0]);return}
   const{data:d2}=await sb.from(T).select('*').eq('code',r.code).maybeSingle();apply(d2)}};
 useEffect(()=>{if(!room)return;const c=room.code;
  const ch=sb.channel('r-'+c).on('postgres_changes',{event:'UPDATE',schema:'public',table:T,filter:'code=eq.'+c},p=>apply(p.new)).subscribe();
  const iv=setInterval(async()=>{const{data}=await sb.from(T).select('*').eq('code',c).maybeSingle();apply(data)},1500);
  return()=>{sb.removeChannel(ch);clearInterval(iv)}},[room&&room.code]);
 useLayoutEffect(()=>{if(sf.current!==null&&sf.current!==g.fxn)(g.fx||[]).forEach(e=>{try{run(e)}catch(_){}});sf.current=room?g.fxn:null},[g.fxn,!!room]);
 useEffect(()=>{if(g.st!=='turn'||g.host!==cid)return;const cb=g.P[g.cur].bot,sl=!g.slam&&g.P.some(p=>p.bot&&bslam(g,p)!==undefined);
  if(!cb&&!sl)return;const t=setTimeout(()=>act(bot2),1000*SP);return()=>clearTimeout(t)},[room&&room.version]);
 const remember=n=>{try{localStorage.setItem('cambio-name',n)}catch(e){}};
 const create=async()=>{const nm_=name.trim()||'Player';setErr('');remember(nm_);
  const c=Array.from({length:4},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.random()*24|0]).join('');
  const st={st:'lobby',P:[{id:cid,name:nm_,bot:false}],host:cid,fx:[],hl:[],fxn:0};
  const{data,error}=await sb.from(T).insert({code:c,version:1,state:st}).select().single();
  if(error)return setErr('Could not create a room: '+error.message);
  ref.current=null;sf.current=null;apply(data);location.hash=c};
 const join=async()=>{const nm_=name.trim()||'Player',c=code.trim().toUpperCase();setErr('');remember(nm_);
  const{data,error}=await sb.from(T).select('*').eq('code',c).maybeSingle();
  if(error)return setErr('Connection problem: '+error.message);
  if(!data)return setErr('Room '+c+' was not found.');
  const mine=data.state.P.some(p=>p.id===cid);
  if(!mine&&data.state.st!=='lobby')return setErr('That game has already started.');
  if(!mine&&data.state.P.length>=8)return setErr('That room is full.');
  ref.current=null;sf.current=null;apply(data);
  if(!mine)await act(n=>{n.P.push({id:cid,name:nm_,bot:false})});
  location.hash=c};
 if(!room)return h`<div className="wrap"><h1>CAMBIO</h1><p className="sub">Online card game for 2–8 players. Lowest score wins.</p>
  <div className="row"><input placeholder="Your name" value=${name} maxLength=14 onInput=${e=>setName(e.target.value)}/></div>
  <div className="acts"><button className="go" onClick=${create}>Create a room</button></div>
  <p className="sub">…or join a friend’s room</p>
  <div className="row"><input placeholder="Room code" value=${code} maxLength=4 onInput=${e=>setCode(e.target.value.toUpperCase())}/><button onClick=${join}>Join</button></div>
  ${err?h`<p className="sub" style=${{color:'#ff9aa2'}}>${err}</p>`:''}
  <div className="rules"><b>How to play.</b> Lowest score wins: red King −2, Ace 1, 2–10 face value, Jack/Queen 10, black King 13. Flip your two bottom cards and memorize them. On your turn draw from the Draw pile (swap it in or discard it) or take the Discard (must swap). Discarding a card you drew triggers its power: 7/8 peek one of yours, 9/10 peek an opponent’s, J/Q blind-swap any two cards, black K peek two cards then optionally swap them. Spot a match with the discard? Tap your own card to STACK it. Miss and you get a penalty card. Call Cambio at the start of your turn: everyone else gets one last turn, and you win only with the strictly lowest score.</div></div>`;
 if(g.st==='lobby'){const host=g.host===cid,cnt=g.P.length;
  return h`<div className="wrap"><h1>CAMBIO</h1><p className="sub">Room code — share it with your friends</p>
  <div className="ban" style=${{letterSpacing:'10px',fontSize:'46px',color:'#f2c94c'}}>${room.code}</div>
  <div className="acts"><button onClick=${()=>{try{navigator.clipboard.writeText(location.href.split('#')[0]+'#'+room.code)}catch(e){}}}>📋 Copy invite link</button></div>
  <div style=${{margin:'12px 0'}}>${g.P.map((p,i)=>h`<div className="row" key=${i}><div className="tg on" style=${{flex:1,padding:'10px',borderRadius:'10px',textAlign:'left'}}>${p.bot?'🤖 ':'🧑 '}${p.name}${p.id===cid?' (you)':''}${p.id===g.host?' ⭐':''}</div>${host&&p.bot?h`<button className="x" onClick=${()=>act(s=>{s.P.splice(i,1)})}>✕</button>`:''}</div>`)}</div>
  <div className="acts">${host?h`<button disabled=${cnt>=8} onClick=${()=>act(s=>{s.P.push({id:'bot'+Math.random().toString(36).slice(2,6),name:'Bot '+(s.P.filter(p=>p.bot).length+1),bot:true})})}>+ Add bot</button><button className="go" disabled=${cnt<2} onClick=${()=>act(s=>reset(s,begin(s.P.map(p=>({id:p.id,name:p.name,bot:p.bot})))))}>Deal cards</button>`:h`<p className="sub">Waiting for the host to deal…</p>`}</div></div>`}
 const me=g.P[g.cur],hum=g.cur===mi,m=g.mode,over=g.st==='over';
 const tap=(p,i)=>{if(g.st==='peek'){if(p===mi&&(i===2||i===3)){setLv(l=>l.includes(i)?l.filter(x=>x!==i):[...l,i]);setSn(s=>s.includes(i)?s:[...s,i])}return}act(g=>{
  const cd=g.P[p].cards[i];if(!cd||g.shield||g.st==='over')return;
  if(g.sl!=null){if(p!==g.sl)return;const t=top(g),P=g.P[p];
   if(cd.r===t.r){fx(g,p+':'+i,'disc',cd,false,true);P.cards[i]=null;delete P.k[i];g.disc.push(cd);g.slam=true;g.msg=P.name+' slammed '+cd.r+cd.s+'!'}
   else{const pc=drw(g);P.cards.push(pc);fx(g,'draw',p+':'+(P.cards.length-1),pc,false,false);g.msg=P.name+' missed — penalty card!'}
   g.sl=null;return}
  if(g.st==='peek'){if(p!==g.pp||i<2||i>3)return;const x=g.view.findIndex(v=>v.i===i);if(x>=0)g.view.splice(x,1);else{g.view.push({p,i});if(!g.seen.includes(i))g.seen.push(i)}return}
  if(g.st!=='turn')return;
  const mine=p===g.cur,md=g.mode,pick=g.cur===mi&&((g.step==='drawn'&&mine)||(g.step==='pw'&&((md==='p1'&&mine)||(md==='p2'&&!mine)||md==='p3'||(md==='p4'&&mine)||(md==='p5'&&!mine))));
  if(!pick){if(p===mi&&!g.slam)stk(g,p,i);return}
  if(g.step==='drawn'&&mine){fx(g,'held',p+':'+i,g.held,true,false);g.hl=[p+':'+i];fx(g,p+':'+i,'disc',cd,false,true);g.P[p].cards[i]=g.held;g.disc.push(cd);g.slam=false;g.msg=nm(g,p)+' swapped, discarding '+cd.r+cd.s;end(g)}
  else if(g.step==='pw'){
   if(((md==='p1'&&mine)||(md==='p2'&&!mine))&&!g.view.length){g.view=[{p,i}];g.hl=[p+':'+i]}
   else if(md==='p3'){if(g.sel.some(v=>v.p===p&&v.i===i))return;g.sel.push({p,i});if(g.sel.length===2){sw(g,g.sel[0],g.sel[1]);g.msg=nm(g,g.cur)+' blind-swapped two cards';end(g)}}
   else if(md==='p4'&&mine){g.view=[{p,i}];g.mode='p5'}
   else if(md==='p5'&&!mine){g.view.push({p,i});g.hl=g.view.map(v=>v.p+':'+v.i);g.mode='p6'}}})};
 const ok=g.step==='start'&&hum&&g.sl==null&&g.st==='turn';
 const drawP=()=>ok&&act(g=>{g.held=drw(g);g.src='draw';g.step='drawn';fx(g,'draw','held',g.held,false,true)});
 const discP=()=>ok&&act(g=>{g.held=g.disc.pop();g.src='disc';g.step='drawn';fx(g,'disc','held',g.held,true,true)});
 const dis=()=>act(g=>{const c=g.held;g.held=null;fx(g,'held','disc',c,true,true);g.disc.push(c);g.slam=false;g.msg=nm(g,g.cur)+' discarded '+c.r+c.s;pw(g,c)});
 const slamBtn=()=>act(g=>{const hs=g.P.map((p,i)=>i).filter(i=>!g.P[i].bot);if(hs.length===1)g.sl=hs[0];else g.slm=true});
 let hint='';
 if(g.st==='peek')hint=g.rd[mi]?'Waiting for the others to look at their cards…':'Flip BOTH of your bottom cards ('+sn.length+'/2 seen) and memorize them. The game won’t start until everyone has.';
 else if(over)hint='';
 else if(g.sl!=null)hint=nm(g,g.sl)+': tap your card that matches the discard ('+top(g).r+').';
 else if(!hum)hint=me.name+' is playing…';
 else if(g.step==='start')hint=me.name+', your turn: tap the Draw pile or the Discard pile, or call Cambio.';
 else if(g.step==='drawn')hint=g.src==='draw'?'Tap one of your cards to swap the drawn card in, or discard it.':'Tap one of your cards to swap it with the discard you took.';
 else if(g.view.length&&(m==='p1'||m==='p2'))hint='Memorize it, then end your turn.';
 else hint={p1:'7/8 power: tap one of YOUR cards to peek.',p2:'9/10 power: tap an OPPONENT’s card to peek.',p3:'J/Q power: tap any two cards to blind-swap ('+g.sel.length+'/2).',p4:'Black King: first tap one of YOUR cards to peek.',p5:'Now tap an OPPONENT’s card to peek.',p6:'Swap these two cards, or keep them where they are?'}[m]||'';
 const sc=over?g.P.map(p=>p.cards.reduce((s,c)=>s+(c?val(c):0),0)):[];let win=[],good=false;
 if(over){const ca=g.cambio;good=sc.every((s,i)=>i===ca||sc[ca]<s);const mn=Math.min(...sc.filter((_,i)=>i!==ca));win=good?[ca]:sc.map((s,i)=>i!==ca&&s===mn?i:-1).filter(i=>i>=0)}
 const n=g.P.length,ord=[...Array(n).keys()].map(k=>(Math.max(mi,0)+k)%n),cw=n<3?54:n<5?46:n<7?38:30,lw=n<5?66:54;
 const rows=z=>{const L=ord.filter((i,k)=>(k<Math.ceil(n/2))===!!z),m=L.length;
  return h`<div className="rs" key=${'r'+z}>${L.map((i,x)=>h`<div key=${i} style=${{transform:'translateY('+((z?-1:1)*Math.pow((x-(m-1)/2)/Math.max(m/2,1),2)*22)+'px)'}}><${Panel} g=${g} i=${i} tap=${tap} s=${over?sc[i]:undefined} w=${win.includes(i)} me=${mi} lv=${lv}/></div>`)}</div>`};
 const mid=h`<div className="mid">
  <div className="pile"><${Card} k="draw" cls=${'lg'+(ok?' hot':'')} lb="DRAW" sty=${{borderRadius:'8px',boxShadow:Array.from({length:Math.min(7,Math.ceil(g.draw.length/10))},(_,k)=>(k+1)+'px '+(k+1)+'px 0 '+(k%2?'#8f1a22':'#f3efe4')).join(',')}} on=${drawP}/><small>Draw pile · ${g.draw.length}</small></div>
  <div className="pile"><div className="dp">${g.disc.slice(-3,-1).map(c=>h`<${Card} key=${c.id} cls="lg" c=${c} up=${true} sty=${{position:'absolute',left:0,top:0,pointerEvents:'none',transform:'rotate('+((c.id*37)%13-6)+'deg)'}}/>`)}<${Card} k="disc" cls=${'lg'+(ok?' hot':'')+(g.st==='turn'&&!g.slam?' stk':'')} c=${top(g)} up=${true} sty=${{position:'absolute',left:0,top:0}} on=${discP}/></div><small>${g.st==='turn'&&!g.slam?'⚡ stackable':'Discard'}</small></div>
  <div className="pile"><div className="hs" data-k="held">${g.held?h`<${Card} cls="lg" c=${g.held} up=${g.src==='disc'||hum}/>`:''}</div><small>${g.held?me.name+'’s hand':'Hand'}</small></div>${g.pop?h`<div key=${g.popk} className=${'pop '+g.pop.k}>${g.pop.t}</div>`:''}</div>`;
 return h`<div className="wrap">
 ${g.shield&&(g.st==='peek'||g.st==='turn')?h`<div className=${'sh'+(g.deal?' dl':'')} style=${g.deal?{animationDelay:((g.P.length*280+800)*SP)+'ms'}:null} onClick=${()=>act(g=>{g.shield=false;g.deal=0})}><h2>Pass device to ${nm(g,g.st==='peek'?g.pp:g.cur)}</h2><p>Tap to Reveal</p></div>`:''}
 ${g.slm?h`<div className="md"><div><b>Who’s slamming?</b>${g.P.map((p,i)=>p.bot?'':h`<button key=${i} onClick=${()=>act(g=>{g.sl=i;g.slm=false})}>${p.name}</button>`)}<button className="x" onClick=${()=>act(g=>{g.slm=false})}>Cancel</button></div></div>`:''}
 <div className="top"><b>CAMBIO · ${room.code}</b>${g.cambio!==null&&!over?h`<span className="al">📣 ${nm(g,g.cambio)} called Cambio — final turns!</span>`:''}<span>Draw pile: ${g.draw.length}</span><button className="x" style=${{padding:'4px 10px'}} onClick=${()=>setSp(sp===1?.6:sp===.6?1.5:1)}>Speed: ${sp===1?'Normal':sp===.6?'Fast':'Slow'}</button></div>
 ${over?h`<div className="ban">🏆 ${win.map(i=>nm(g,i)).join(' & ')} ${win.length>1?'win':'wins'}!</div><div className="bar"><p>${good?nm(g,g.cambio)+' called Cambio and had the strictly lowest score.':nm(g,g.cambio)+' called Cambio without the strictly lowest score, so they lose automatically.'}</p>
  ${g.host===cid?h`<div className="acts"><button className="go" onClick=${()=>act(s=>reset(s,begin(s.cfg)))}>Play again</button><button onClick=${()=>act(s=>reset(s,{st:'lobby',P:s.cfg.map(p=>({id:p.id,name:p.name,bot:p.bot})),fx:[],hl:[],fxn:0}))}>Back to lobby</button></div>`:h`<p className="msg">Waiting for the host to start the next round…</p>`}</div>`
 :h`<div className="bar"><p>${hint}</p>${g.st==='turn'&&!g.slam&&(g.step==='start'||!hum)?h`<p className="msg">⚡ Spot a match? Tap your own card with the same rank as the discard to STACK it!</p>`:''}${g.msg&&g.st==='turn'?h`<p className="msg">${g.msg}</p>`:''}
  <div className="acts">
   ${g.st==='peek'&&!g.rd[mi]?h`<button className="go" disabled=${!(sn.includes(2)&&sn.includes(3))} onClick=${()=>{setLv([]);setSn([]);act(g=>{g.rd[mi]=true;if(g.rd.every(Boolean)){g.st='turn';g.cur=0;g.shield=false}})}}>Ready — hide my cards</button>`:''}
   ${ok?h`<button className="cb" onClick=${()=>act(g=>{g.cambio=g.cur;g.msg=nm(g,g.cur)+' called Cambio!';end(g)})}>Call Cambio!</button>`:''}
   ${g.st==='turn'&&hum&&g.step==='drawn'&&g.src==='draw'?h`<button onClick=${dis}>Discard it</button>`:''}
   ${g.st==='turn'&&hum&&g.step==='pw'&&m==='p6'?h`<button className="go" onClick=${()=>act(g=>{sw(g,g.view[0],g.view[1]);g.msg=nm(g,g.cur)+' swapped two cards';end(g)})}>Swap them</button><button onClick=${()=>act(g=>end(g))}>Keep</button>`:''}
   ${g.st==='turn'&&hum&&g.step==='pw'&&m!=='p6'?h`<button onClick=${()=>act(g=>end(g))}>${g.view.length?'Hide & end turn':'Skip power'}</button>`:''}
   ${g.st==='turn'&&g.sl!=null?h`<button className="x" onClick=${()=>act(g=>{g.sl=null})}>Cancel slam</button>`:''}
   
  </div></div>`}
 <div className="tb" style=${{'--cw':cw+'px','--lw':lw+'px'}}><div className="felt"/>${rows(0)}${mid}${rows(1)}</div></div>`}
ReactDOM.createRoot(document.getElementById('r')).render(h`<${App}/>`);
})();
</script></body></html>
